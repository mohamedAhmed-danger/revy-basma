{% extends "admin/_base.html" %}
{% set active_nav = 'shifts' %}

{% block title %}إضافة شفت — {{ t('brand_name') }}{% endblock %}

{% block content %}
<div style="margin-bottom:14px;">
  <a class="btn btn--secondary" style="padding:6px 14px; font-size:13px;" href="{{ url_for('admin.shifts') }}">← الرجوع للشفتات</a>
</div>

<div class="page-header">
  <h1 class="page-header__title">إضافة شفت جديد</h1>
</div>

<div class="panel" style="max-width: 520px; margin: 0;">
  <form method="POST" action="{{ url_for('admin.shifts_create') }}" style="display:flex; flex-direction:column; gap:16px;">
    <div class="field">
      <label class="field__label" for="name">اسم الشفت</label>
      <input class="field__input" type="text" id="name" name="name" placeholder="مثال: الشفت الصباحي" required autofocus>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
      <div class="field">
        <label class="field__label" for="shift_start_time">بداية الشفت</label>
        <input class="field__input" type="time" id="shift_start_time" name="shift_start_time" value="08:00" required>
      </div>
      <div class="field">
        <label class="field__label" for="sign_in_end_time">آخر وقت لتسجيل الحضور</label>
        <input class="field__input" type="time" id="sign_in_end_time" name="sign_in_end_time" value="10:00" required>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
      <div class="field">
        <label class="field__label" for="grace_period_minutes">فترة السماح (دقيقة)</label>
        <input class="field__input" type="number" id="grace_period_minutes" name="grace_period_minutes" min="0" value="15" required>
      </div>
      <div class="field">
        <label class="field__label" for="min_full_shift_hours">أقل عدد ساعات لشفت كامل</label>
        <input class="field__input" type="number" step="0.5" id="min_full_shift_hours" name="min_full_shift_hours" min="0.5" value="3" required>
      </div>
    </div>

    <div class="field">
      <p id="preview-strip" class="field__label" style="color:var(--primary); font-weight:600;"></p>
    </div>

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button type="submit" class="btn btn--primary">حفظ الشفت</button>
      <a class="btn btn--secondary" href="{{ url_for('admin.shifts') }}">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
function updateShiftPreview() {
  var startEl = document.getElementById('shift_start_time');
  var endEl = document.getElementById('sign_in_end_time');
  var graceEl = document.getElementById('grace_period_minutes');
  var previewEl = document.getElementById('preview-strip');

  var start = startEl.value;
  var end = endEl.value;
  var grace = parseInt(graceEl.value, 10);

  if (!start || !end || isNaN(grace)) {
    previewEl.textContent = '';
    return;
  }

  function toMinutes(hhmm) {
    var parts = hhmm.split(':');
    return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
  }
  function toHHMM(mins) {
    mins = ((mins % 1440) + 1440) % 1440;
    var h = Math.floor(mins / 60).toString().padStart(2, '0');
    var m = (mins % 60).toString().padStart(2, '0');
    return h + ':' + m;
  }

  var startMin = toMinutes(start);
  var lateBoundary = startMin + grace;

  if (lateBoundary >= toMinutes(end)) {
    previewEl.textContent =
      toHHMM(startMin) + '–' + toHHMM(toMinutes(end)) + ' في الميعاد · بعدها مرفوض';
  } else {
    previewEl.textContent =
      toHHMM(startMin) + '–' + toHHMM(lateBoundary) + ' في الميعاد · ' +
      toHHMM(lateBoundary + 1) + '–' + toHHMM(toMinutes(end)) + ' متأخر لكن مسموح · بعد ' +
      toHHMM(toMinutes(end)) + ' مرفوض';
  }
}

['shift_start_time', 'sign_in_end_time', 'grace_period_minutes'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', updateShiftPreview);
});
updateShiftPreview();
</script>
{% endblock %}
