{% extends "admin/_base.html" %}
{% set active_nav = 'zones' %}

{% block title %}تعديل مقر: {{ zone.name }} — {{ t('brand_name') }}{% endblock %}

{% block content %}
<div style="margin-bottom:14px;">
  <a class="btn btn--secondary" style="padding:6px 14px; font-size:13px;" href="{{ url_for('admin.zones') }}">← الرجوع للمقرات</a>
</div>

<div class="page-header">
  <h1 class="page-header__title">تعديل مقر: {{ zone.name }}</h1>
</div>

<div class="panel" style="max-width: 520px; margin: 0;">
  <form method="POST" action="{{ url_for('admin.zones_edit', zone_id=zone.id) }}" style="display:flex; flex-direction:column; gap:16px;">
    <div class="field">
      <label class="field__label" for="name">اسم المقر / الفرع</label>
      <input class="field__input" type="text" id="name" name="name" value="{{ zone.name }}" required autofocus>
    </div>

    <div class="field">
      <button type="button" id="locate-btn" class="btn btn--secondary btn--block" onclick="fillFromLocation()">
        📍 تحديث بالإحداثيات الحالية تلقائياً
      </button>
      <p id="locate-status" class="field__label" style="text-align:center; margin-top:6px;"></p>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
      <div class="field">
        <label class="field__label" for="latitude">خط العرض (Latitude)</label>
        <input class="field__input" type="text" id="latitude" name="latitude" value="{{ zone.latitude }}" required>
      </div>
      <div class="field">
        <label class="field__label" for="longitude">خط الطول (Longitude)</label>
        <input class="field__input" type="text" id="longitude" name="longitude" value="{{ zone.longitude }}" required>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="radius_meters">نطاق السماح الجغرافي (متر)</label>
      <input class="field__input" type="number" id="radius_meters" name="radius_meters" min="1" value="{{ zone.radius_meters }}" required>
    </div>

    <div class="field">
      <label class="field__label" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" name="is_active" value="1" {% if zone.is_active %}checked{% endif %}>
        المقر نشط ومفعّل
      </label>
    </div>

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button type="submit" class="btn btn--primary">حفظ التعديلات</button>
      <a class="btn btn--secondary" href="{{ url_for('admin.zones') }}">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
function fillFromLocation() {
  var status = document.getElementById('locate-status');
  var button = document.getElementById('locate-btn');

  if (!navigator.geolocation) {
    status.textContent = 'المتصفح لا يدعم تحديد الموقع';
    status.style.color = 'var(--danger-dark)';
    return;
  }

  button.disabled = true;
  status.textContent = 'جاري تحديد موقعك الجغرافي...';
  status.style.color = 'var(--primary)';

  navigator.geolocation.getCurrentPosition(
    function (position) {
      document.getElementById('latitude').value = position.coords.latitude.toFixed(6);
      document.getElementById('longitude').value = position.coords.longitude.toFixed(6);
      status.textContent = 'تم تحديد الموقع بنجاح (دقة ' + Math.round(position.coords.accuracy) + ' متر تقريباً)';
      status.style.color = 'var(--ok-dark)';
      button.disabled = false;
    },
    function (error) {
      status.textContent = 'تعذر تحديد الموقع، يرجى السماح للمتصفح بالوصول للموقع الجغرافي';
      status.style.color = 'var(--danger-dark)';
      button.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}
</script>
{% endblock %}
