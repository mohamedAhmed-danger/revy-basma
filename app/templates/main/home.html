{% extends "base.html" %}

{% block title %}{{ t('brand_name') }} — {{ t('brand_tagline') }}{% endblock %}

{% block content %}
<section style="max-width:800px; margin:40px auto; padding:32px; background:var(--surface); border:1px solid var(--border-color); border-radius:var(--radius-xl); box-shadow:var(--shadow-md); text-align:center;">

  <div style="display:flex; justify-content:center; margin-bottom:20px;">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="{{ t('brand_name') }}" style="height:64px; object-fit:contain;">
  </div>

  <h1 style="font-size:26px; font-weight:800; color:var(--text-main); margin-bottom:10px;">{{ t('brand_name') }}</h1>
  <p style="font-size:15px; color:var(--text-muted); max-width:500px; margin:0 auto 24px auto;">
    {{ t('brand_tagline') }}
  </p>

  <div style="display:flex; justify-content:center; gap:12px;">
    <a class="btn btn--primary" href="{{ url_for('auth.login') }}">{{ t('login_title') }}</a>
  </div>

</section>
{% endblock %}
